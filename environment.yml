name: MolMiner
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.11
  - numpy
  - seaborn
  - openbabel
  - vina
  - swig  # for autodock
  - graphviz  # dot binary for keras plot_model
  - pip
  - pip:
      - MolMiner
      - notebook
      - pandas
      - rdkit
      - scikit-learn>=1.8
      - keras
      - pydot  # for keras plot_model
      - scikeras
      - torch
      - optuna
      - scipy
      - tqdm
      - legendkit
      - umap-learn
      - splito
      - safe-mol==0.1.13
      - transformers<5.0.0  # for safe-mol
      - mols2grid
      - xgboost
      - meeko
      - gemmi  # meeko dependency

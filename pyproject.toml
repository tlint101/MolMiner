[project]
name = "MolMiner"
version = "0.0.3"
description = "Tools for Cheminformatic Workflows."
authors = [{ name = "Tony Eight Lin", email = "tonyelin@tmu.edu.tw" }]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "scipy>=1.17.1",
    "rdkit>=2025.9.6",
    "datamol>=0.12.5",
    "scikit-learn>=1.8",
    "splito>=0.1.4",
    "umap-learn>=0.5.11",
    "matplotlib>=3.7",
    "seaborn>=0.13.2",
    "legendkit>=0.3.6",
    "tqdm>=4.67.3",
    "requests>=2.31.0",
    "fsspec>=2021.9",
    "pillow>=10.0.1",
    "ipython>=8.0.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.10.0",
    "keras>=3.13.2",
    "xgboost>=3.2.0",
    "optuna>=4.2.1",
]
docking = [
    "prolif>=2.1.0",
    "meeko>=0.6.1",
]
safe = [
    "safe-mol == 0.1.13",
    "transformers == 4.51.0",
]
vina = ["vina>=1.2.7"]
all = ["MolMiner[ml,docking,safe]"]

[project.urls]
repository = "https://github.com/tlint101/MolMiner.git"

[tool.uv.build-backend]
module-name = ["mminer"]
module-root = ""
source-exclude = ["**/.DS_Store"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "py50 >=1.1.0",
    "shap >=0.47.1",
    "marimo >= 0.23.15",
    "notebook>=7.5.4",
    "ipykernel>=7.2.0",
    "mols2grid>=2.2.0",
]
